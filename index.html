<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"><style>body{font-family:'Outfit',sans-serif}</style></head><body class="bg-[#050507] text-white min-h-screen p-5"><div class="max-w-md mx-auto pt-6"><div class="flex justify-between items-center mb-8"><h1 class="text-2xl font-black">💎 Glow Money</h1><div class="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-500"></div></div><div class="bg-gradient-to-br from-pink-600/20 to-purple-600/20 backdrop-blur-xl border border-pink-500/20 rounded-[32px] p-8 text-center"><p class="text-pink-300/60 text-xs tracking-[3px]">TOTAL BALANCE</p><p id="bal" class="text-5xl font-black mt-3 tracking-tight">$28.00</p><div class="mt-4 inline-flex gap-2 text-xs bg-white/10 px-3 py-1 rounded-full"><span>🟢</span> +12% this month</div></div><div id="list" class="mt-8 space-y-3"></div><div class="mt-6 bg-white/[0.05] backdrop-blur border border-white/10 rounded-[20px] p-3 flex gap-3"><input id="title" placeholder="Shopping..." class="flex-1 bg-transparent px-3 outline-none text-sm"><input id="amt" type="number" placeholder="$" class="w-20 bg-black/40 border border-white/10 rounded-xl px-3 py-3 outline-none"><button onclick="add()" class="bg-gradient-to-r from-pink-500 to-purple-600 w-12 h-12 rounded-xl font-black text-xl">+</button></div></div><script>let t=JSON.parse(localStorage.getItem('glow-v2')||'[1,2,25]');let titles=JSON.parse(localStorage.getItem('glow-t')||'["Coffee","Snack","Food"]');function render(){let s=0;const l=document.getElementById('list');l.innerHTML='';t.forEach((v,i)=>{s+=v; l.innerHTML+=`<div class="bg-white/[0.04] border border-white/[0.06] rounded-2xl p-4 flex justify-between items-center"><div class="flex gap-3 items-center"><div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center">${i%2==0?'🛍️':'💸'}</div><div><p class="font-bold text-sm">${titles[i]||'Expense'}</p><p class="text-xs text-white/40">Today</p></div></div><b class="text-pink-300">$${v.toFixed(2)}</b></div>`});document.getElementById('bal').innerText='$'+s.toFixed(2);}function add(){const v=parseFloat(document.getElementById('amt').value);const tt=document.getElementById('title').value||'Expense';if(!v)return;t.push(v);titles.push(tt);localStorage.setItem('glow-v2',JSON.stringify(t));localStorage.setItem('glow-t',JSON.stringify(titles));document.getElementById('amt').value='';document.getElementById('title').value='';render();}render();</script></body></html>
